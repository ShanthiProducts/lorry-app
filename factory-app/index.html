.btn.big{padding:16px;font-size:18px}.card.late{border:2px solid #f59e0b}.warn{color:#b45309}.bad{color:#b91c1c}

<main>
  <section class="screen" id="s-home"><div id="homeBody"></div>
    <div class="foot">Shanthi Food Products · කම්හල් App v4.3.4 · Internet නැතුවත් වැඩ කරනවා · දත්ත Encrypt කරලා යවන්නේ</div></section>

<script>
'use strict';
const $=id=>document.getElementById(id),KEY='sbpFactoryApp1',FS='https://firestore.googleapis.com/v1/projects/';
let S=load(),screen='home',cloudBusy=false,ckey=null;
function blank(){return {me:'',cloud:null,cfg:null,outbox:[],sent:[],seq:0,dev:'',bookLast:{},drafts:{},cloudErr:'',cloudOk:'',pulledAt:''};}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');return x&&typeof x==='object'?{...blank(),...x}:blank();}catch(e){return blank();}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('⚠️ Phone එකේ ඉඩ නැහැ — සුරකින්න බැරි වුණා!','err');}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const TZ='Asia/Colombo';
function lkParts(d){const p={};try{new Intl.DateTimeFormat('en-GB',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(d||new Date()).forEach(x=>p[x.type]=x.value);}catch(e){const x=d||new Date();p.year=x.getFullYear();p.month=String(x.getMonth()+1).padStart(2,'0');p.day=String(x.getDate()).padStart(2,'0');p.hour=String(x.getHours()).padStart(2,'0');p.minute=String(x.getMinutes()).padStart(2,'0');}return p;}
function today(){const p=lkParts();return `${p.year}-${p.month}-${p.day}`;}
/* Sri Lanka time for any saved moment (records keep world time inside) */
function fmtAt(iso,withDate){if(!iso)return '';const d=new Date(iso);if(isNaN(d))return '';const p=lkParts(d);return (withDate?`${p.year}-${p.month}-${p.day} `:'')+`${p.hour}:${p.minute}`;}
function addDays(ds,n){const d=new Date(ds+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
/* work day: before the day-end time set on the PC (default 04:00) it is still “yesterday” — same rule as the PC */
function workDay(){const p=lkParts(),de=(S.cfg&&S.cfg.de)||'04:00';return `${p.hour}:${p.minute}`<de?addDays(today(),-1):today();}
function lateNight(){return workDay()!==today();}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function money(n){return 'රු. '+(Math.round((Number(n)||0)*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function r2(n){return Math.round((Number(n)||0)*100)/100;}
function num(v){const n=Number(v);return Number.isFinite(n)?n:0;}
function toast(t,c){const el=$('toast');el.textContent=t;el.className='toast show '+(c||'');clearTimeout(toast.t);toast.t=setTimeout(()=>el.className='toast',c==='err'?5000:2600);}
function ensureDev(){if(!S.dev){S.dev='F'+uid();save();}return S.dev;}
/* ---------- code format (same as the lorry app) + AES-GCM encryption with this phone's own key ---------- */
function fnv(str){let h=0x811c9dc5;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0;}return h.toString(16).padStart(8,'0');}
function b64(bytes){let bin='';for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(bin);}
function unb64(s){const bin=atob(s);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
function urlKey(k){k=String(k).replace(/-/g,'+').replace(/_/g,'/');while(k.length%4)k+='=';return unb64(k);}
async function getKey(){if(ckey)return ckey;if(!S.cloud||!S.cloud.k)throw new Error('no key');ckey=await crypto.subtle.importKey('raw',urlKey(S.cloud.k),'AES-GCM',false,['encrypt','decrypt']);return ckey;}
async function seal(type,obj){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await getKey(),new TextEncoder().encode(JSON.stringify(obj))));const b=b64(new TextEncoder().encode(JSON.stringify({v:1,iv:b64(iv),ct:b64(ct)})));return `SBP1:${type}:${b}:${fnv(type+':'+b)}`;}
async function unseal(code,type){const m=/SBP1:([a-z]+):([A-Za-z0-9+/=\s]+):([0-9a-f]{8})/.exec(code||'');if(!m||m[1]!==type)throw new Error('bad');const b=m[2].replace(/\s+/g,'');if(fnv(type+':'+b)!==m[3])throw new Error('checksum');const box=JSON.parse(new TextDecoder().decode(unb64(b)));const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(box.iv)},await getKey(),unb64(box.ct));return JSON.parse(new TextDecoder().decode(pt));}
/* ---------- link: #f=project~box~key (opened from the link, or pasted inside the app) ---------- */
function applyFLink(t){const m=/[#&]f=([a-z][a-z0-9-]{4,29})~([A-Za-z0-9_-]{20,64})~([A-Za-z0-9_-]{40,60})/.exec(String(t||''));if(!m)return false;{const c={p:m[1],b:m[2],k:m[3]};if(!S.cloud||S.cloud.b!==c.b||S.cloud.k!==c.k){if(S.outbox.length&&S.cloud&&!confirm('⚠️ තවම PC එකට නොගිය දේවල් '+S.outbox.length+'ක් තියෙනවා. අලුත් link එකට මාරු වුණොත් ඒවා අලුත් යතුරෙන් යනවා. හරිද?')){}S.cloud=c;S.cfg=null;ckey=null;save();}}return true;}
(function(){if(applyFLink(location.hash)){try{history.replaceState(null,'','#home');}catch(e){}}})();
function useLink(t){if(!applyFLink(String(t||'').trim())){toast('මේක කම්හල් app link එක නෙවෙයි. PC එකෙන් එවපු “🏭 කම්හල් App” link එකම copy කරන්න.','err');return false;}toast('🔑 සකස් කළා ✅');sync(true).then(()=>render());go(S.me?'home':'setup');return true;}
/* v4.3.6 · iPhone: Safari and the Home-screen icon keep separate data */
const IOS_TAB=/iP(hone|ad|od)/.test(navigator.userAgent)&&navigator.standalone===false;
function iosHint(){return IOS_TAB?`<div class="warnbox">📱 <strong>iPhone:</strong> මේ open වෙලා තියෙන්නේ <strong>Safari</strong> එකේ. Safari එකේ දාන දේ Home screen icon එකේ app එකට <strong>එන්නේ නැහැ</strong> (iPhone ඒ දෙක වෙනම තියාගන්නවා).<br>➊ Share ⬆️ → <strong>Add to Home Screen</strong> ➋ ඒ icon එකෙන් app එක open කරන්න ➌ ⚙️ සැකසුම් → <strong>🔗 Link එක paste කරන්න</strong>.</div>`:'';}

function fsBase(){return `${FS}${S.cloud.p}/databases/(default)/documents/boxes/${S.cloud.b}`;}
function cloudErrText(st,j){const s=((j||{}).error||{}).status||'';if(st===429||s==='RESOURCE_EXHAUSTED')return 'Firebase අද සීමාව ඉවරයි — හෙට ඉබේම යනවා (බිල් phone එකේ ආරක්ෂිතයි)';if(st===403||s==='PERMISSION_DENIED')return 'Firebase Rules හරි නැහැ';if(st===404)return 'Firebase project / mailbox හමු වුණේ නැහැ';return 'Firebase දෝෂය '+st;}
async function flush(){
  if(!S.cloud||!S.outbox.length)return true;
  for(const m of S.outbox.slice()){
    let r;try{r=await fetch(`${fsBase()}/in?documentId=${encodeURIComponent(m.id)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fields:{code:{stringValue:m.code},at:{stringValue:m.at}}})});}
    catch(e){S.cloudErr='Internet නැහැ — signal ආපු ගමන් ඉබේම යනවා';save();return false;}
    if(r.ok||r.status===409){S.outbox=S.outbox.filter(x=>x.id!==m.id);const h=S.sent.find(x=>x.uid===m.uid);if(h)h.up=new Date().toISOString();S.cloudErr='';S.cloudOk=new Date().toISOString();save();}
    else{let j={};try{j=await r.json();}catch(e){}S.cloudErr=cloudErrText(r.status,j);save();return false;}
  }
  return true;
}
async function pull(){

  if(!r.ok){let j={};try{j=await r.json();}catch(e){}S.cloudErr=cloudErrText(r.status,j);save();return;}
  const j=await r.json(),f=j.fields||{},at=(f.at||{}).stringValue||'',code=(f.code||{}).stringValue||'';
  if(code&&(!S.cfg||S.cfg.pushAt!==at)){try{const c=await unseal(code,'fcfg');c.pushAt=at;S.cfg=c;Object.entries(c.bl||{}).forEach(([k,v])=>{if(!S.bookLast[k]||S.bookLast[k].d<v.d||(S.bookLast[k].d===v.d&&S.bookLast[k].n<v.n))S.bookLast[k]=v;});}catch(e){S.cloudErr='PC එකෙන් ආපු ලැයිස්තුව කියවන්න බැහැ — link එක පරණද? (PC එකෙන් අලුත් link එක ගන්න)';save();return;}}
  S.cloudErr='';S.cloudOk=new Date().toISOString();S.pulledAt=new Date().toISOString();save();
}

function custName(d){return d.cn==='__walk'?'🚶 නම නැති කෙනෙක්':(cust(d.c)||[0,d.cn])[1];}
function itemPicker(k,field){return `<div class="field"><input type="search" id="pq_${field}" placeholder="🔎 භාණ්ඩය (නම / කේතය)" oninput="prodList('${k}','${field}')" autocomplete="off"></div><div id="pl_${field}"></div>`;}
function prodList(k,field){const q=norm($('pq_'+field).value),l=q?P().filter(p=>norm(p[1]).includes(q)||(p[2]&&norm(p[2])===q)).slice(0,20):[];$('pl_'+field).innerHTML=l.map(p=>`<button class="pick" onclick="addItem('${k}','${field}','${esc(p[0])}')"><span>${p[2]?`<em>${esc(p[2])}</em> `:''}${esc(p[1])}</span><b>${money(custPrice(cust(D(k).c),p))}</b></button>`).join('');}
function addItem(k,field,pid){const d=D(k),p=prod(pid);if(!p)return;const list=d[field];let x=list.find(i=>i[0]===pid);if(!x){x=[pid,0,0,custPrice(cust(d.c),p)];list.push(x);}x[1]+=1;if(field==='it'&&k==='bill')x[2]=freeFor(p,x[1]);save();render();setTimeout(()=>{const el=$('q_'+field+'_'+pid);if(el){el.focus();el.select();}},30);}
function setItem(k,field,pid,i,v){const d=D(k),x=d[field].find(r=>r[0]===pid);if(!x)return;x[i]=i===3?r2(num(v)):Math.max(0,Math.floor(num(v)));if(i===1&&field==='it'&&k==='bill'&&!x.fm)x[2]=freeFor(prod(pid),x[1]);if(i===2)x.fm=1;save();totals(k);}
function rmItem(k,field,pid){const d=D(k);d[field]=d[field].filter(r=>r[0]!==pid);save();render();}
function itemRows(k,field,opt){opt=opt||{};const d=D(k);return d[field].map(x=>{const p=prod(x[0])||[x[0],'?'];return `<div class="irow"><div class="iname">${esc(p[1])}${opt.price&&p[3]&&x[3]<custPrice(cust(d.c),p)-0.004?' <span class="bad small">⬇️ සාමාන්‍ය '+money(custPrice(cust(d.c),p))+'</span>':''}</div><label>ගණන<input type="number" inputmode="numeric" min="0" id="q_${field}_${esc(x[0])}" value="${x[1]}" onchange="setItem('${k}','${field}','${esc(x[0])}',1,this.value)"></label>${opt.free?`<label>🎁<input type="number" inputmode="numeric" min="0" value="${x[2]||0}" onchange="setItem('${k}','${field}','${esc(x[0])}',2,this.value)"></label>`:''}${opt.price?`<label>මිල<input type="number" inputmode="decimal" min="0" step="0.01" value="${x[3]}" onchange="setItem('${k}','${field}','${esc(x[0])}',3,this.value)"></label>`:''}${opt.kind?`<label>තත්ත්වය<select onchange="D('${k}').${field}.find(r=>r[0]==='${esc(x[0])}')[2]=this.value;save()"><option value="good" ${x[2]!=='damage'?'selected':''}>✅ හොඳයි</option><option value="damage" ${x[2]==='damage'?'selected':''}>⚠️ Damage</option></select></label>`:''}<button class="x" onclick="rmItem('${k}','${field}','${esc(x[0])}')">✕</button></div>`;}).join('')||'<div class="empty small">තවම භාණ්ඩ නැහැ</div>';}
function billCalc(d){const c=cust(d.c),pct=c?num(c[6]):0;let g=0,base=0;d.it.forEach(x=>{const v=r2(x[1]*x[3]);g+=v;const p=prod(x[0]);if(!(p&&p[4]))base+=v;});const disc=r2(base*pct/100);const later=d.later.reduce((s,x)=>s+r2(x[1]*x[3]),0);return {g:r2(g),disc,net:r2(g-disc),later:r2(later),pct};}
function totals(k){const el=$('tot_'+k);if(!el)return;const d=D(k);if(k==='bill'){const t=billCalc(d);el.innerHTML=`එකතුව ${money(t.g)}${t.disc?` · Discount ${t.pct}% -${money(t.disc)}`:''} · <strong>බිල ${money(t.net)}</strong>${t.later?`<br>⏳ පස්සේ දෙන බඩු ${money(t.later)}`:''}`;}if(k==='order'){const s=d.it.reduce((a,x)=>a+x[1]*x[3],0);el.innerHTML=`ඇණවුම ${money(s)}`;}}
function bookPicker(d){const bt=(S.cfg.bt||[]);if(!bt.length)return '';const last=d.book&&S.bookLast[d.book];return `<div class="card"><div class="row2"><div class="field"><label>📒 පොත</label><select onchange="D(screen).book=this.value;save();render()"><option value="">— පොතක් නැහැ —</option>${bt.map(b=>`<option value="${esc(b[0])}" ${d.book===b[0]?'selected':''}>${esc(b[1])}${b[2]?' (සිල්ලර)':''}</option>`).join('')}</select></div><div class="field"><label>පොතේ බිල් අංකය</label><input type="number" inputmode="numeric" min="1" value="${esc(d.no)}" onchange="D(screen).no=this.value;save()" id="bookNo"></div></div>${d.book?`<button class="btn sm light" onclick="nextNo()">▶ ඊළඟ අංකය${last?' ('+(last.n+1)+')':''}</button> <span class="small muted">${last?'අන්තිම: #'+last.n+' ('+esc(last.d)+')':''}</span>`:''}</div>`;}
function nextNo(){const d=D(screen),l=S.bookLast[d.book];d.no=String(l?l.n+1:1);save();render();}
function dateField(k){return `<div class="field"><label>📅 දිනය</label><input type="date" max="${today()}" value="${esc(D(k).d)}" onchange="D('${k}').d=this.value>today()?today():(this.value||workDay());save();render()"></div>${lateNight()&&D(k).d===workDay()?`<div class="warnbox small">🌙 රෑ 12 පහු වුණාට වැඩ දවස තවම ඊයේ (${esc(workDay())}) — PC එකේ වගේම. අද දිනය ඕනේ නම් ඉහළින් වෙනස් කරන්න.</div>`:''}`;}
function payBox(k,t){const d=D(k),m=d.pay.m,walk=d.cn==='__walk';const seg=(v,l)=>`<button class="${m===v?'on':''}" onclick="D('${k}').pay.m='${v}';save();render()">${l}</button>`;
  return `<div class="card"><h3>💰 ගෙවීම</h3><div class="seg">${seg('cash','💵 සම්පූර්ණ Cash')}${walk?'':seg('credit','📒 ණයට')+seg('part','➗ කොටසක්')+seg('cheque','🏦 චෙක්')}</div>
   ${m==='part'||m==='cheque'?`<div class="field"><label>ලැබුණු මුදල (රු.)</label><input type="number" inputmode="decimal" min="0" value="${esc(d.pay.amt)}" onchange="D('${k}').pay.amt=this.value;save()"></div>`:''}
   ${m==='cheque'?`<div class="row2"><div class="field"><label>චෙක් අංකය</label><input value="${esc(d.pay.no||'')}" onchange="D('${k}').pay.no=this.value;save()"></div><div class="field"><label>බැංකුව</label><input value="${esc(d.pay.bank||'')}" onchange="D('${k}').pay.bank=this.value;save()"></div></div><div class="field"><label>චෙක් දිනය</label><input type="date" value="${esc(d.pay.cd||'')}" onchange="D('${k}').pay.cd=this.value;save()"></div>${photoField(k)}`:''}</div>`;}
/* cheque photo (optional): made small on the phone before it is sent */
function photoField(k){const ph=D(k).pay.ph;return `<div class="field"><label>📷 චෙක් ෆොටෝ (ඕනේ නම්)</label><input type="file" accept="image/*" capture="environment" onchange="takePhoto('${k}',this)">${ph?`<img src="${ph}" style="max-height:90px;border-radius:8px;margin-top:6px"> <button class="btn sm light" onclick="delete D('${k}').pay.ph;save();render()">✕</button>`:''}</div>`;}
function takePhoto(k,input){const f=input.files&&input.files[0];if(!f)return;const img=new Image(),url=URL.createObjectURL(f);img.onload=()=>{const m=640,sc=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);let q=0.6,d=c.toDataURL('image/jpeg',q);while(d.length>90000&&q>0.25){q-=0.1;d=c.toDataURL('image/jpeg',q);}URL.revokeObjectURL(url);D(k).pay.ph=d;save();render();};img.onerror=()=>toast('ෆොටෝ එක කියවන්න බැහැ','err');img.src=url;}

  $('billBody').innerHTML=`<div class="card">${dateField('bill')}</div>${bookPicker(d)}${custPicker('bill',true)}
   <div class="card"><h3>📦 බඩු</h3>${itemPicker('bill','it')}${itemRows('bill','it',{free:1,price:1})}</div>
   ${d.cn==='__walk'?'':`<details class="card" ${d.later.length?'open':''}><summary><strong>⏳ නැති බඩු — පස්සේ දෙනවා (ඇණවුමක්)</strong></summary>${itemPicker('bill','later')}${itemRows('bill','later',{price:1})}<div class="field"><label>දෙන්න පොරොන්දු වුණ දිනය</label><input type="date" value="${esc(d.prom)}" onchange="D('bill').prom=this.value;save()"></div></details>`}
   <div class="totbox" id="tot_bill"></div>${payBox('bill')}
   <div class="field card"><label>සටහන</label><input maxlength="200" value="${esc(d.note)}" onchange="D('bill').note=this.value;save()"></div>
   <button class="btn primary block big" onclick="sendBill()">📤 බිල PC එකට යවන්න</button>`;totals('bill');}
async function sendBill(){const d=D('bill');
  if(!d.c&&!d.cn){toast('කඩය තෝරන්න (නම නැත්නම් “🚶 නම නැති කෙනෙක්”)','err');return;}
  if(!d.it.some(x=>x[1]>0)&&!d.later.some(x=>x[1]>0)){toast('භාණ්ඩ දාන්න','err');return;}
  if(d.it.some(x=>x[1]>0&&!(x[3]>0))){toast('මිල නැති භාණ්ඩයක් තියෙනවා','err');return;}
  if(d.book&&!(num(d.no)>0)){toast('📒 පොතේ අංකය දාන්න (නැත්නම් “පොතක් නැහැ”)','err');$('bookNo')&&$('bookNo').focus();return;}
  const t=billCalc(d),m=d.pay.m,amt=m==='cash'?t.net:m==='credit'?0:r2(num(d.pay.amt));
  if((m==='part'||m==='cheque')&&!(amt>0)){toast('ලැබුණු මුදල දාන්න','err');return;}
  if(m==='cheque'&&(!d.pay.no||!d.pay.cd)){toast('චෙක් අංකය සහ දිනය දාන්න','err');return;}
  if(d.book){const dup=S.sent.find(x=>x.k==='bill'&&x.rec.book===d.book&&String(x.rec.no)===String(num(d.no))&&x.d===d.d);if(dup&&!confirm(`⚠️ ${d.d} දින මේ පොතේ #${num(d.no)} දැනටමත් යැව්වා. ආයෙත් යවනවාද?`))return;}
  const c=cust(d.c);if(c&&c[4]>0&&m!=='cash'&&c[3]+t.net-amt>c[4]&&!confirm(`⚠️ ${c[1]} ණය සීමාව (${money(c[4])}) පනිනවා. ඒත් යවන්නද? (PC එකේ රතු ලකුණක් පේනවා)`))return;
  const body={d:d.d,book:d.book,no:d.book?Math.floor(num(d.no)):0,c:d.cn==='__walk'?'':d.c,cn:d.cn==='__walk'?'':d.cn,it:d.it.filter(x=>x[1]>0).map(x=>[x[0],x[1],x[2]||0,x[3]]),later:d.later.filter(x=>x[1]>0).map(x=>[x[0],x[1],x[3]]),prom:d.prom,pay:{m,amt,no:d.pay.no||'',bank:d.pay.bank||'',cd:d.pay.cd||'',...(m==='cheque'&&d.pay.ph?{ph:d.pay.ph}:{})},note:d.note,est:t.net};
  if(await send('bill',body,`🧾 ${custName(d)} ${money(t.net)}${d.book?' · #'+body.no:''}`)){if(d.book){S.bookLast[d.book]={d:d.d,n:body.no};}newDraft('bill');save();toast('✅ බිල යැව්වා');go('home');}}

function renderPay(){const d=D('pay'),c=cust(d.c);$('payBody').innerHTML=`<div class="card">${dateField('pay')}</div>${custPicker('pay',false)}
  <div class="card"><div class="field"><label>ලැබුණු මුදල (රු.)</label><input type="number" inputmode="decimal" min="0" value="${esc(d.amt)}" onchange="D('pay').amt=this.value;save()"></div>
  <div class="seg"><button class="${d.pay.m!=='cheque'?'on':''}" onclick="D('pay').pay.m='cash';save();render()">💵 Cash</button><button class="${d.pay.m==='cheque'?'on':''}" onclick="D('pay').pay.m='cheque';save();render()">🏦 චෙක්</button></div>
  ${d.pay.m==='cheque'?`<div class="row2"><div class="field"><label>චෙක් අංකය</label><input value="${esc(d.pay.no||'')}" onchange="D('pay').pay.no=this.value;save()"></div><div class="field"><label>බැංකුව</label><input value="${esc(d.pay.bank||'')}" onchange="D('pay').pay.bank=this.value;save()"></div></div><div class="field"><label>චෙක් දිනය</label><input type="date" value="${esc(d.pay.cd||'')}" onchange="D('pay').pay.cd=this.value;save()"></div>${photoField('pay')}`:''}</div>
  <button class="btn primary block big" onclick="sendPay()">📤 PC එකට යවන්න</button>`;}
async function sendPay(){const d=D('pay'),c=cust(d.c),amt=r2(num(d.amt));if(!c){toast('කඩය තෝරන්න','err');return;}if(!(amt>0)){toast('මුදල දාන්න','err');return;}if(d.pay.m==='cheque'&&(!d.pay.no||!d.pay.cd)){toast('චෙක් අංකය සහ දිනය දාන්න','err');return;}
  if(amt>c[3]+0.004&&!confirm(`${c[1]} ගේ ණය ${money(c[3])} — ඊට වඩා වැඩියි. ඉතිරිය advance විදිහට PC එකේ බලනවා. යවන්නද?`))return;
  if(await send('pay',{d:d.d,c:c[0],amt,m:d.pay.m==='cheque'?'cheque':'cash',no:d.pay.no||'',bank:d.pay.bank||'',cd:d.pay.cd||'',...(d.pay.m==='cheque'&&d.pay.ph?{ph:d.pay.ph}:{})},`💰 ${c[1]} ${money(amt)}`)){newDraft('pay');toast('✅ යැව්වා');go('home');}}

async function sendRet(){const d=D('ret'),c=cust(d.c);if(!c){toast('කඩය තෝරන්න','err');return;}const it=d.it.filter(x=>x[1]>0);if(!it.length){toast('භාණ්ඩ දාන්න','err');return;}

const MK={exchange:'🔄 මාරු කර දුන්නා (Damage → අලුත්)',home:'🏠 ගෙදරට',sample:'🎁 නියැදි / තෑගි / ප්‍රවර්ධන',staff:'👷 සේවකයෙක් ගත්තා (පඩියෙන් අඩු)',fdamage:'⚠️ කම්හල ඇතුළේ Damage / කල් ඉකුත්'};
function renderMove(){const d=D('move');$('moveBody').innerHTML=`<div class="card">${dateField('move')}<div class="field"><label>මොකක්ද?</label><select onchange="D('move').kind=this.value;save();render()"><option value="">— තෝරන්න —</option>${Object.entries(MK).map(([k,v])=>`<option value="${k}" ${d.kind===k?'selected':''}>${v}</option>`).join('')}</select></div>
  ${d.kind==='staff'?`<div class="field"><label>සේවකයාගේ නම</label><input value="${esc(d.staff)}" list="staffL" onchange="D('move').staff=this.value;save()"><datalist id="staffL">${((S.cfg&&S.cfg.st)||[]).map(n=>`<option value="${esc(n)}">`).join('')}</datalist></div>`:''}</div>
  ${d.kind==='exchange'?custPicker('move',false):''}
  <div class="card"><h3>${d.kind==='exchange'?'📤 දුන්න අලුත් බඩු':'📦 බඩු'}</h3>${itemPicker('move','it')}${itemRows('move','it',{})}</div>
  ${d.kind==='exchange'?`<div class="card"><h3>📥 ආපහු ගත්ත Damage බඩු</h3>${itemPicker('move','back')}${itemRows('move','back',{})}</div>`:''}
  <div class="card field"><label>සටහන / හේතුව</label><input maxlength="200" value="${esc(d.note)}" onchange="D('move').note=this.value;save()"></div>
  <button class="btn primary block big" onclick="sendMove()">📤 PC එකට යවන්න</button>`;}
async function sendMove(){const d=D('move');if(!d.kind){toast('මොකක්ද කියලා තෝරන්න','err');return;}const it=d.it.filter(x=>x[1]>0);if(!it.length){toast('බඩු දාන්න','err');return;}if(d.kind==='staff'&&d.staff.trim().length<2){toast('සේවකයාගේ නම දාන්න','err');return;}if(d.kind==='exchange'&&!d.c){toast('කඩය තෝරන්න','err');return;}
  if(await send('move',{d:d.d,kind:d.kind,c:d.c||'',staff:d.staff.trim(),it:it.map(x=>[x[0],x[1]]),back:d.back.filter(x=>x[1]>0).map(x=>[x[0],x[1]]),note:d.note},`📦 ${MK[d.kind]}`)){newDraft('move');toast('✅ යැව්වා');go('home');}}
/* ---------- drawer take ---------- */
const TK={raw:'🧂 අමු ද්‍රව්‍ය',supplier:'🏪 සැපයුම්කරුට',wage:'👷 පඩි / අත්තිකාරම්',owner:'👤 මම ගත්තා (ගෙදරට)',other:'📝 වෙනත්'};
function renderTake(){const d=D('take');$('takeBody').innerHTML=`<div class="card">${dateField('take')}<div class="field"><label>ගත්ත මුදල (රු.)</label><input type="number" inputmode="decimal" min="0" value="${esc(d.amt)}" onchange="D('take').amt=this.value;save()"></div>
  <div class="field"><label>මොකටද?</label><select onchange="D('take').kind=this.value;save()"><option value="">— තෝරන්න —</option>${Object.entries(TK).map(([k,v])=>`<option value="${k}" ${d.kind===k?'selected':''}>${v}</option>`).join('')}</select></div>
  <div class="field"><label>කවුද ගත්තේ / කාටද</label><input value="${esc(d.staff)}" onchange="D('take').staff=this.value;save()"></div><div class="field"><label>හේතුව</label><input maxlength="200" value="${esc(d.note)}" onchange="D('take').note=this.value;save()"></div></div>
  <button class="btn primary block big" onclick="sendTake()">📤 PC එකට යවන්න</button>`;}
async function sendTake(){const d=D('take'),amt=r2(num(d.amt));if(!(amt>0)){toast('මුදල දාන්න','err');return;}if(!d.kind){toast('මොකටද කියලා තෝරන්න','err');return;}
  if(await send('take',{d:d.d,amt,kind:d.kind,who:d.staff.trim(),reason:d.note},`💸 ${TK[d.kind]} ${money(amt)}`)){newDraft('take');toast('✅ යැව්වා');go('home');}}
/* ---------- orders ---------- */
function renderOrder(){const d=D('order');$('orderBody').innerHTML=`<div class="card">${dateField('order')}</div>${custPicker('order',false)}
  <div class="card"><h3>📋 ඇණවුම් බඩු</h3>${itemPicker('order','it')}${itemRows('order','it',{price:1})}<div class="totbox" id="tot_order"></div>
  <div class="field"><label>දෙන්න පොරොන්දු වුණ දිනය</label><input type="date" value="${esc(d.prom)}" onchange="D('order').prom=this.value;save()"></div></div>
  <div class="card"><h3>💵 කලින් ගෙව්වා (advance)</h3><div class="field"><input type="number" inputmode="decimal" min="0" placeholder="0 = බඩු ලැබුණාම" value="${esc(d.adv)}" onchange="D('order').adv=this.value;save()"></div></div>
  <button class="btn primary block big" onclick="sendOrder()">📤 PC එකට යවන්න</button>`;totals('order');}
async function sendOrder(){const d=D('order'),c=cust(d.c);if(!c){toast('කඩය තෝරන්න','err');return;}const it=d.it.filter(x=>x[1]>0);if(!it.length){toast('බඩු දාන්න','err');return;}
  if(await send('order',{d:d.d,c:c[0],it:it.map(x=>[x[0],x[1],x[3]]),prom:d.prom,adv:r2(num(d.adv))},`📋 ${c[1]} ඇණවුම`)){newDraft('order');toast('✅ යැව්වා');go('home');}}
function renderOrders(){const o=(S.cfg.o||[]),sent=new Set(S.sent.filter(x=>x.k==='odel').map(x=>x.rec.o+'|'+x.rec.at.slice(0,10)));
  $('ordersBody').innerHTML=o.length?o.map(x=>{const late=x[4]&&x[4]<today();return `<div class="card ${late?'late':''}"><div class="row"><div class="grow"><strong>${esc(x[2])}</strong><div class="small muted">${esc(x[6]||'')} · ගත්තේ ${esc(x[7]||'')}${x[4]?' · පොරොන්දුව '+esc(x[4]):''}${late?' <span class="bad">⏰ පරක්කුයි</span>':''}${x[5]>0?' · advance '+money(x[5]):''}</div></div></div>
   ${x[3].map(i=>`<div class="irow"><div class="iname">${esc(i[1])} <span class="muted small">(${i[2]}ක්)</span></div><label>දුන්නේ<input type="number" inputmode="numeric" min="0" max="${i[2]}" value="${i[2]}" id="od_${esc(x[0])}_${esc(i[0])}"></label></div>`).join('')}
   <button class="btn primary block" onclick="sendDeliver('${esc(x[0])}')">✓ දුන්නා — PC එකට යවන්න</button></div>`;}).join(''):'<div class="card empty">දෙන්න තියෙන ඇණවුම් නැහැ ✅</div>';}
async function sendDeliver(id){const x=(S.cfg.o||[]).find(o=>o[0]===id);if(!x)return;const it=x[3].map(i=>[i[0],Math.max(0,Math.min(i[2],Math.floor(num(($('od_'+id+'_'+i[0])||{}).value))))]).filter(i=>i[1]>0);if(!it.length){toast('ගණන් දාන්න','err');return;}
  if(S.sent.some(s=>s.k==='odel'&&s.rec.o===id&&!okSet().has(s.uid))&&!confirm('මේ ඇණවුම දුන්නා කියලා දැනටමත් යැව්වා (PC එක තවම අනුමත කළේ නැහැ). ආයෙත් යවනවාද?'))return;
  if(await send('odel',{d:today(),o:id,c:x[1],it},`🚚 ${x[2]} ඇණවුම දුන්නා`)){toast('✅ යැව්වා');go('home');}}
/* ---------- history / setup ---------- */
function renderHistory(){const ok=okSet(),out=new Set(S.outbox.map(x=>x.uid));
  $('historyBody').innerHTML=cloudLine()+(S.sent.length?S.sent.slice(0,120).map(x=>`<div class="hist"><div class="grow"><strong>${esc(x.label)}</strong><div class="small muted">${esc(x.d)} · ${esc(fmtAt(x.at))}${x.up?' · ☁️ '+esc(fmtAt(x.up)):''}</div></div><span class="${ok.has(x.uid)?'ok':out.has(x.uid)?'bad':'wait'}">${ok.has(x.uid)?'✅ PC එකේ':out.has(x.uid)?'📱 phone එකේ':'☁️ ගියා'}</span></div>`).join(''):'<div class="card empty">තවම නැහැ</div>');}
function renderSetup(){$('setupBody').innerHTML=`<div class="card"><div class="field"><label>ඔයාගේ නම</label><input id="meName" maxlength="40" value="${esc(S.me)}"></div><button class="btn primary block" onclick="const n=$('meName').value.trim();if(n.length<2){toast('නම දාන්න','err');return;}S.me=n;save();toast('✅ සුරැකුවා');go('home')">💾 සුරකින්න</button></div>
  <div class="card">${cloudLine()}<div class="small muted">${S.cloud?'Project: '+esc(S.cloud.p):'සකසලා නැහැ'} · Phone ID: ${esc(ensureDev())}</div><button class="btn light block" onclick="askPersist()">🔒 Phone එකේ ස්ථිරව තියාගන්න ඉල්ලන්න</button><p class="small muted">⚠️ Chrome → “Clear data” / app එක (Home screen icon එක) මකන්න එපා — PC එකට නොගිය බිල් නැති වෙනවා. Phone එක මාරු කරනවා නම් PC එකෙන් අලුත් link එකක් ගන්න (පරණ එක ඉබේම නවතිනවා).</p></div>`+linkBox(S.cloud?'Phone එක මාරු කළොත් / අලුත් link එකක් ආවොත්:':'');}
async function askPersist(){try{const ok=navigator.storage&&navigator.storage.persist?await navigator.storage.persist():false;toast(ok?'✅ ස්ථිර ගබඩාව ලැබුණා':'Phone එක ඉඩ දුන්නේ නැහැ — app එක Home screen එකට දාලා පාවිච්චි කරන්න',ok?'ok':'warn');}catch(e){toast('බැහැ','warn');}}
/* ---------- start ---------- */
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync(false);});
window.addEventListener('online',()=>sync(false));
setInterval(()=>{if(!document.hidden)sync(false);},5*60*1000);
go(S.me||!S.cloud?'home':'setup');sync(false).then(()=>{if(screen==='home')render();});
</script>
</body>
</html>

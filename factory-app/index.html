<script>
'use strict';
const $=id=>document.getElementById(id),KEY='sbpFactoryApp1',FS='https://firestore.googleapis.com/v1/projects/';
let S=load(),screen='home',cloudBusy=false,ckey=null;
function blank(){return {me:'',cloud:null,cfg:null,outbox:[],sent:[],seq:0,dev:'',bookLast:{},drafts:{},cloudErr:'',cloudOk:'',pulledAt:'',recent:[],notes:[],nack:[],newProds:[],myB:[],myL:[],ld:null,stk:null,fbatAt:'',bsync:''};}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');return x&&typeof x==='object'?{...blank(),...x}:blank();}catch(e){return blank();}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('⚠️ Phone එකේ ඉඩ නැහැ — සුරකින්න බැරි වුණා!','err');}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const TZ='Asia/Colombo';
function lkParts(d){const p={};try{new Intl.DateTimeFormat('en-GB',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(d||new Date()).forEach(x=>p[x.type]=x.value);}catch(e){const x=d||new Date();p.year=x.getFullYear();p.month=String(x.getMonth()+1).padStart(2,'0');p.day=String(x.getDate()).padStart(2,'0');p.hour=String(x.getHours()).padStart(2,'0');p.minute=String(x.getMinutes()).padStart(2,'0');}return p;}
function today(){const p=lkParts();return `${p.year}-${p.month}-${p.day}`;}
/* Sri Lanka time for any saved moment (records keep world time inside) */
function fmtAt(iso,withDate){if(!iso)return '';const d=new Date(iso);if(isNaN(d))return '';const p=lkParts(d);return (withDate?`${p.year}-${p.month}-${p.day} `:'')+`${p.hour}:${p.minute}`;}
function addDays(ds,n){const d=new Date(ds+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
/* work day: before the day-end time set on the PC (default 04:00) it is still “yesterday” — same rule as the PC */
function workDay(){const p=lkParts(),de=(S.cfg&&S.cfg.de)||'04:00';return `${p.hour}:${p.minute}`<de?addDays(today(),-1):today();}
function lateNight(){return workDay()!==today();}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function money(n){return 'රු. '+(Math.round((Number(n)||0)*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function r2(n){return Math.round((Number(n)||0)*100)/100;}
function num(v){const n=Number(v);return Number.isFinite(n)?n:0;}
function toast(t,c){const el=$('toast');el.textContent=t;el.className='toast show '+(c||'');clearTimeout(toast.t);toast.t=setTimeout(()=>el.className='toast',c==='err'?5000:2600);}
function ensureDev(){if(!S.dev){S.dev='F'+uid();save();}return S.dev;}
/* ---------- code format (same as the lorry app) + AES-GCM encryption with this phone's own key ---------- */
function fnv(str){let h=0x811c9dc5;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0;}return h.toString(16).padStart(8,'0');}
function b64(bytes){let bin='';for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(bin);}
function unb64(s){const bin=atob(s);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
function urlKey(k){k=String(k).replace(/-/g,'+').replace(/_/g,'/');while(k.length%4)k+='=';return unb64(k);}
async function getKey(){if(ckey)return ckey;if(!S.cloud||!S.cloud.k)throw new Error('no key');ckey=await crypto.subtle.importKey('raw',urlKey(S.cloud.k),'AES-GCM',false,['encrypt','decrypt']);return ckey;}
async function seal(type,obj){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await getKey(),new TextEncoder().encode(JSON.stringify(obj))));const b=b64(new TextEncoder().encode(JSON.stringify({v:1,iv:b64(iv),ct:b64(ct)})));return `SBP1:${type}:${b}:${fnv(type+':'+b)}`;}
async function unseal(code,type){const m=/SBP1:([a-z]+):([A-Za-z0-9+/=\s]+):([0-9a-f]{8})/.exec(code||'');if(!m||m[1]!==type)throw new Error('bad');const b=m[2].replace(/\s+/g,'');if(fnv(type+':'+b)!==m[3])throw new Error('checksum');const box=JSON.parse(new TextDecoder().decode(unb64(b)));const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(box.iv)},await getKey(),unb64(box.ct));return JSON.parse(new TextDecoder().decode(pt));}
/* ---------- link: #f=project~box~key (opened from the link, or pasted inside the app) ---------- */
function applyFLink(t){const m=/[#&]f=([a-z][a-z0-9-]{4,29})~([A-Za-z0-9_-]{20,64})~([A-Za-z0-9_-]{40,60})/.exec(String(t||''));if(!m)return false;{const c={p:m[1],b:m[2],k:m[3]};if(!S.cloud||S.cloud.b!==c.b||S.cloud.k!==c.k){if(S.outbox.length&&S.cloud&&!confirm('⚠️ තවම PC එකට නොගිය දේවල් '+S.outbox.length+'ක් තියෙනවා. අලුත් link එකට මාරු වුණොත් ඒවා අලුත් යතුරෙන් යනවා. හරිද?')){}S.cloud=c;S.cfg=null;ckey=null;save();}}return true;}
(function(){if(applyFLink(location.hash)){try{history.replaceState(null,'','#home');}catch(e){}}})();
function useLink(t){if(!applyFLink(String(t||'').trim())){toast('මේක කම්හල් app link එක නෙවෙයි. PC එකෙන් එවපු “🏭 කම්හල් App” link එකම copy කරන්න.','err');return false;}toast('🔑 සකස් කළා ✅');sync(true).then(()=>render());go(S.me?'home':'setup');return true;}
/* v4.3.6 · iPhone: Safari and the Home-screen icon keep separate data */
const IOS_TAB=/iP(hone|ad|od)/.test(navigator.userAgent)&&navigator.standalone===false;
function iosHint(){return IOS_TAB?`<div class="warnbox">📱 <strong>iPhone:</strong> මේ open වෙලා තියෙන්නේ <strong>Safari</strong> එකේ. Safari එකේ දාන දේ Home screen icon එකේ app එකට <strong>එන්නේ නැහැ</strong> (iPhone ඒ දෙක වෙනම තියාගන්නවා).<br>➊ Share ⬆️ → <strong>Add to Home Screen</strong> ➋ ඒ icon එකෙන් app එක open කරන්න ➌ ⚙️ සැකසුම් → <strong>🔗 Link එක paste කරන්න</strong>.</div>`:'';}
function linkBox(note){return `<div class="card"><h3>🔗 Link එක මෙතන paste කරන්න</h3><p class="small muted">${note} WhatsApp එකේ link එක ඔබාගෙන ඉඳලා <strong>Copy</strong> කරලා, මේ app එක ඇතුළේ මෙතන දාන්න. (iPhone එකේ Home screen app එකට link එක දාන්න පුළුවන් එකම ක්‍රමය මේකයි.)</p><div class="field"><input id="linkIn" placeholder="https://…" autocomplete="off" autocapitalize="off" spellcheck="false"></div><button class="btn light block" onclick="pasteLink()">📋 Copy කරපු link එක ගන්න</button><button class="btn primary block" onclick="useLink($('linkIn').value)">✅ සකසන්න</button></div>`;}
async function pasteLink(){try{const t=await navigator.clipboard.readText();$('linkIn').value=t;useLink(t);}catch(e){toast('Clipboard කියවන්න බැහැ. Box එක ඇතුළේ ඔබාගෙන ඉඳලා “Paste” කරන්න.','warn');$('linkIn').focus();}}

function fsBase(){return `${FS}${S.cloud.p}/databases/(default)/documents/boxes/${S.cloud.b}`;}
function cloudErrText(st,j){const s=((j||{}).error||{}).status||'';if(st===429||s==='RESOURCE_EXHAUSTED')return 'Firebase අද සීමාව ඉවරයි — හෙට ඉබේම යනවා (බිල් phone එකේ ආරක්ෂිතයි)';if(st===403||s==='PERMISSION_DENIED')return 'Firebase Rules හරි නැහැ';if(st===404)return 'Firebase project / mailbox හමු වුණේ නැහැ';return 'Firebase දෝෂය '+st;}
async function flush(){
  if(!S.cloud||!S.outbox.length)return true;
  for(const m of S.outbox.slice()){
    let r;try{r=await fetch(`${fsBase()}/in?documentId=${encodeURIComponent(m.id)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fields:{code:{stringValue:m.code},at:{stringValue:m.at}}})});}
    catch(e){S.cloudErr='Internet නැහැ — signal ආපු ගමන් ඉබේම යනවා';save();return false;}
    if(r.ok||r.status===409){S.outbox=S.outbox.filter(x=>x.id!==m.id);const h=S.sent.find(x=>x.uid===m.uid);if(h)h.up=new Date().toISOString();S.cloudErr='';S.cloudOk=new Date().toISOString();save();}
    else{let j={};try{j=await r.json();}catch(e){}S.cloudErr=cloudErrText(r.status,j);save();return false;}
  }
  return true;
}
async function pull(){
  if(!S.cloud)return;let r;try{r=await fetch(`${fsBase()}/out/fcfg`,{cache:'no-store'});}catch(e){S.cloudErr='Internet නැහැ';save();return;}
  if(r.status===404){S.cloudErr=S.cfg?'⚠️ මේ phone එකේ link එක පරණයි (PC එකෙන් අලුත් යතුරක් හැදුවා). PC එකෙන් අලුත් link එක අරන් open කරන්න. තවම නොගිය බිල් phone එකේ ආරක්ෂිතයි.':'PC එකෙන් තවම ලැයිස්තුව ආවේ නැහැ (PC එකේ “🏭 කම්හල් App” පිටුව එක පාරක් open කරන්න)';save();return;}
  if(!r.ok){let j={};try{j=await r.json();}catch(e){}S.cloudErr=cloudErrText(r.status,j);save();return;}
  let j;try{j=await r.json();}catch(e){S.cloudErr='Internet එකෙන් හරි උත්තරයක් ආවේ නැහැ (Wi-Fi login පිටුවක්ද?)';save();return;}const f=j.fields||{},at=(f.at||{}).stringValue||'',code=(f.code||{}).stringValue||'';
  if(code&&(!S.cfg||S.cfg.pushAt!==at)){try{const c=await unseal(code,'fcfg');c.pushAt=at;S.cfg=c;Object.entries(c.bl||{}).forEach(([k,v])=>{if(!S.bookLast[k]||S.bookLast[k].d<v.d||(S.bookLast[k].d===v.d&&S.bookLast[k].n<v.n))S.bookLast[k]=v;});}catch(e){S.cloudErr='PC එකෙන් ආපු ලැයිස්තුව කියවන්න බැහැ — link එක පරණද? (PC එකෙන් අලුත් link එක ගන්න)';save();return;}}
  S.cloudErr='';S.cloudOk=new Date().toISOString();S.pulledAt=new Date().toISOString();save();
  try{await pullBatches();}catch(e){console.warn('batches',e);}
}
async function sync(manual){if(!S.cloud){if(manual)toast('Link එකෙන් open කරලා නැහැ. PC එකෙන් “🏭 කම්හල් app link” එක ගන්න.','warn');return;}if(cloudBusy)return;cloudBusy=true;try{await flush();await pull();}finally{cloudBusy=false;}if(manual)toast(S.cloudErr?'⚠️ '+S.cloudErr:'☁️ යැව්වා / ගත්තා ✅',S.cloudErr?'warn':'ok');if(['home','history','setup'].includes(screen))render();}
async function send(k,body,label,quiet){
  if(!S.cloud||!S.cfg){toast('PC එකෙන් ලැයිස්තුව තවම ආවේ නැහැ.','err');return false;}
  if((body.d||'')>today()){toast('අනාගත දිනයක් දාන්න බැහැ — දිනය හරි කරන්න.','err');return false;}
  const rec={uid:ensureDev()+'-'+(++S.seq),rev:1,k,d:body.d||workDay(),at:new Date().toISOString(),by:S.me||'',pv:S.cfg.pv||'',...body};
  let code;try{code=await seal('fx',rec);}catch(e){toast('Encrypt කරන්න බැරි වුණා: '+e.message,'err');return false;}
  S.outbox.push({id:'fx_'+rec.uid.replace(/[^A-Za-z0-9_-]/g,'_'),uid:rec.uid,code,at:rec.at});
  if(!quiet){const keep=JSON.parse(JSON.stringify(rec));if(keep.ph)keep.ph=1;if(keep.pay&&keep.pay.ph)keep.pay.ph=1;S.sent.unshift({uid:rec.uid,k,d:rec.d,at:rec.at,label,rec:keep});S.sent=S.sent.slice(0,400);}save();
  flush().then(()=>{if(['home','history'].includes(screen))render();});return true;
}
/* ---------- lists from the PC ---------- */
/* p: [id,name,code,price,noDisc,freePer,freeGive,kind('l' loose | 'r' raw | 0 packet)]
   c: [id,name,route,debt,limit,prices,disc%,phone,lastBill[[pid,qty,price]],usuallyCredit,routeId,staff] */
const P=()=>S.cfg?S.cfg.p:[],C=()=>S.cfg?S.cfg.c:[];
const prod=id=>P().find(p=>p[0]===id)||newProd(id),cust=id=>C().find(c=>c[0]===id);
function custPrice(c,p){if(c&&c[5]&&c[5][p[0]]!==undefined)return c[5][p[0]];return p[3];}
function freeFor(p,q){return p&&p[5]>0&&!isW(p)?Math.floor(q/p[5])*p[6]:0;}
function okSet(){return new Set((S.cfg&&S.cfg.ok)||[]);}
function rjMap(){return new Map(((S.cfg&&S.cfg.rj)||[]).map(x=>[x[0],x[1]]));}
function norm(s){return String(s||'').toLowerCase().replace(/\s+/g,' ').trim();}
function digits(s){return String(s||'').replace(/\D+/g,'');}
/* ⚖️ goods sold by weight (🌶️ loose powder / 🧂 raw materials): quantity in kg (3 decimals = 1 g), price per kg */
function isW(p){return !!(p&&(p[7]==='l'||p[7]==='r'));}
function kg(q){return Math.round((Number(q)||0)*1000)/1000;}
function wText(q){q=kg(q);return q>0&&q<1?Math.round(q*1000)+' g':q+' kg';}
function qText(p,q){return isW(p)?wText(q):String(q);}
/* new loose / raw items typed on this phone (the PC confirms them) */
function newProd(id){const n=(S.newProds||[]).find(x=>x.id===id);return n?[n.id,n.name,'',0,1,0,0,n.kind==='raw'?'r':'l',1]:undefined;}
/* paper books: factory books first, then the lorry books (a lorry book used here keeps its own number sequence) */
function books(){return (S.cfg&&S.cfg.bt)||[];}
function bookOf(id){return books().find(b=>b[0]===id)||null;}
function bookName(id){const b=bookOf(id);if(!b)return id||'';return (b[3]==='l'?'🚚 ලොරි ':'')+b[1];}
function nextNoOf(book){const l=book&&S.bookLast[book];if(!l)return null;const bs=(S.cfg&&S.cfg.bs)||50;return l.n>=bs&&l.n%bs===0?1:l.n+1;}
function autoNo(d){if(S.cfg&&S.cfg.ab===0)return;if(!d.book){d.no='';d.noAuto=0;return;}if(d.no&&!d.noAuto)return;const n=nextNoOf(d.book);d.no=n?String(n):'';d.noAuto=n?1:0;}

/* ---------- drafts ---------- */
function newDraft(k,keep){keep=keep||{};
  const d={d:keep.d||workDay(),c:'',cn:'',it:[],later:[],pay:{m:'cash',amt:''},book:'',no:'',noAuto:0,note:'',kind:'',back:[],staff:'',amt:'',prom:'',adv:'',advm:'cash',cr:'',cph:'',cv:'',chain:keep.chain?1:0};
  if(k==='bill'){d.book=keep.book!==undefined?keep.book:(S.lastBook!==undefined&&(S.lastBook===''||bookOf(S.lastBook))?S.lastBook:'');autoNo(d);}
  S.drafts[k]=d;save();}
function D(k){if(!S.drafts[k])newDraft(k);return S.drafts[k];}
function setCust(k,id){const d=D(k);d.c=id;d.cn='';d.staff=cust(id)&&cust(id)[11]?1:0;if(d.staff&&!['cash','salary'].includes(d.pay.m))d.pay.m='cash';if(!d.staff&&d.pay.m==='salary')d.pay.m='cash';save();render();}
function custPicker(k,allowNew){
  const d=D(k),c=cust(d.c);
  if(c||d.cn){const newName=d.cn&&d.cn!=='__walk';
    return `<div class="card"><div class="row"><div class="grow"><strong>${d.staff?'👷 ':''}${esc(custName(d))}</strong>${c?`<div class="small muted">${d.staff?'සේවකයා':esc(c[2]||'Route නැහැ')}${c[7]?' · 📞 '+esc(c[7]):''} · ණය ${money(c[3])}${c[4]>0&&c[3]>c[4]?' <span class="bad">⚠️ සීමාව '+money(c[4])+' පැනලා</span>':''}</div>`:newName?`<div class="small warn">🆕 අලුත් ${d.staff?'සේවක නමක්':'නමක්'} — PC එකේදී බලනවා</div>`:''}</div><button class="btn sm light" onclick="D('${k}').c='';D('${k}').cn='';D('${k}').staff=0;save();render()">වෙනස් කරන්න</button></div>
     ${newName&&!d.staff?`<div class="row2"><div class="field"><label>🛣️ Route</label><select onchange="D('${k}').cr=this.value;save()"><option value="">— Route එකක් නැහැ / කම්හලට එන කෙනෙක් —</option>${((S.cfg&&S.cfg.r)||[]).map(r=>`<option value="${esc(r[0])}" ${d.cr===r[0]?'selected':''}>${esc(r[1])}</option>`).join('')}</select></div><div class="field"><label>📞 දුරකථන</label><input type="tel" inputmode="tel" maxlength="20" value="${esc(d.cph)}" placeholder="ඕනේ නම්" onchange="D('${k}').cph=this.value.trim();save()"></div></div>${S.cfg&&S.cfg.vo?`<div class="field"><label>🏘️ ගම${S.cfg.vr?' *':''}</label><input list="vl_${k}" maxlength="40" value="${esc(d.cv||'')}" placeholder="ගම (උදා: මාවතුපොළ)" onchange="D('${k}').cv=this.value.trim();save()"><datalist id="vl_${k}">${vilOpts(d.cr)}</datalist><div class="small muted">එකම නමින් කඩ කිහිපයක් තියෙන නිසා — “නම – ගම”</div></div>`:''}`:''}
     ${k==='bill'&&!d.it.length?sameAsLastBtn(d):''}</div>`;}
  return `<div class="card"><div class="field"><label>👤 කඩය / පාරිභෝගිකයා</label><input type="search" id="cq" placeholder="නම / 📞 අංකය / Route" oninput="custList('${k}',${allowNew?1:0})" autocomplete="off"></div><div id="cl">${custListHtml(k,allowNew,'')}</div>${k==='bill'?`<div class="row2"><button class="btn light" onclick="D('bill').c='';D('bill').cn='__walk';D('bill').staff=0;D('bill').pay.m='cash';save();render()">🚶 නම නැති කෙනෙක් (Cash)</button><button class="btn light" onclick="staffPick()">👷 සේවකයෙක්</button></div>`:''}</div>`;
}
function custRow(k,c){return `<button class="pick" onclick="setCust('${k}','${esc(c[0])}')"><span>${c[11]?'👷 ':''}${esc(c[1])}<small>${esc(c[11]?'සේවකයා':(c[2]||'Route නැහැ'))}${c[7]?' · 📞 '+esc(c[7]):''}</small></span>${c[3]>0?`<b>${money(c[3])}</b>`:''}</button>`;}
function custListHtml(k,allowNew,raw){
  const q=norm(raw),dq=digits(raw);
  if(!q){const rec=(S.recent||[]).map(cust).filter(Boolean).slice(0,10);return rec.length?`<div class="small muted" style="margin:2px 0 6px">🕘 මෑතකදී</div>`+rec.map(c=>custRow(k,c)).join(''):'';}
  const l=C().filter(c=>norm(c[1]).includes(q)||(dq.length>=3&&digits(c[7]).includes(dq))||(q.length>=2&&norm(c[2]).includes(q))).sort((a,b)=>(norm(a[1]).startsWith(q)?0:1)-(norm(b[1]).startsWith(q)?0:1)).slice(0,30);
  return l.map(c=>custRow(k,c)).join('')+(allowNew&&q.length>=2&&!dq.length&&!C().some(c=>norm(c[1])===q)?`<button class="pick new" onclick="D('${k}').cn=$('cq').value.trim().slice(0,60);D('${k}').staff=0;save();render()">🆕 “${esc(raw.trim())}” අලුත් නමක් විදිහට</button>`:'')+(!l.length&&dq.length>=3?'<div class="empty small">ඒ අංකයට කඩයක් නැහැ</div>':'');}
function custList(k,allowNew){$('cl').innerHTML=custListHtml(k,allowNew,$('cq').value);}
function custName(d){return d.cn==='__walk'?'🚶 නම නැති කෙනෙක්':(cust(d.c)||[0,d.cn])[1];}
function rememberCust(id){if(!id)return;S.recent=[id].concat((S.recent||[]).filter(x=>x!==id)).slice(0,10);}
/* 👷 a staff member buying (mostly loose / raw goods): cash, or deducted from pay */
function staffPick(){const names=[...new Set(((S.cfg&&S.cfg.st)||[]).concat(C().filter(c=>c[11]).map(c=>c[1])))].sort();
  sheet(`<h3>👷 සේවකයා කවුද?</h3>${names.map(n=>`<button class="pick" onclick="staffSet(${esc(JSON.stringify(n))})"><span>👷 ${esc(n)}</span></button>`).join('')||'<p class="small muted">තවම සේවක නම් නැහැ — පහළින් ලියන්න.</p>'}<div class="field"><label>අලුත් නමක්</label><input id="stNew" maxlength="40"></div><button class="btn primary block" onclick="const v=$('stNew').value.trim();if(v.length<2){toast('නම ලියන්න','err');return;}staffSet(v)">හරි</button><button class="btn ghost block" onclick="sheet()">අවලංගු</button>`);}
function staffSet(name){const d=D('bill'),c=C().find(x=>x[11]&&norm(x[1])===norm(name));d.c=c?c[0]:'';d.cn=c?'':name;d.staff=1;if(!['cash','salary'].includes(d.pay.m))d.pay.m='cash';save();sheet();render();}
/* 🔁 the same goods as this shop's last bill (this phone's last one, or the PC's) */
function lastBillOf(cid){const mine=S.sent.find(x=>x.k==='bill'&&x.rec&&x.rec.c===cid&&!x.gone);if(mine)return mine.rec.it.map(x=>[x[0],x[1]]);const c=cust(cid);return c&&Array.isArray(c[8])?c[8].map(x=>[x[0],x[1]]):null;}
function sameAsLastBtn(d){if(!d.c)return '';const l=lastBillOf(d.c);if(!l||!l.length)return '';const ok=l.filter(x=>P().some(p=>p[0]===x[0]));if(!ok.length)return '';return `<button class="btn light block" onclick="sameAsLast()">🔁 අන්තිම බිල වගේම <span class="small muted">(${ok.map(x=>esc(prod(x[0])[1])+' '+qText(prod(x[0]),x[1])).slice(0,4).join(', ')}${ok.length>4?' …':''})</span></button>`;}
function sameAsLast(){const d=D('bill'),c=cust(d.c),l=(lastBillOf(d.c)||[]).filter(x=>P().some(p=>p[0]===x[0]));d.it=l.map(([pid,q])=>{const p=prod(pid);return [pid,q,freeFor(p,q),isW(p)?loosePrice(d,p):custPrice(c,p)];});save();render();toast('🔁 දැම්මා — ගණන් වෙනස් කරන්න පුළුවන්');}
function loosePrice(d,p){const lp=(S.cfg&&S.cfg.lp)||{},key=(d.c||'_')+'|'+p[0];const mine=S.sent.find(x=>x.k==='bill'&&x.rec&&(x.rec.c||'')===(d.c||'')&&(d.c||x.rec.cn===d.cn)&&x.rec.it.some(i=>i[0]===p[0]));if(mine)return mine.rec.it.find(i=>i[0]===p[0])[3];return lp[key]!==undefined?lp[key]:(p[3]||0);}
function itemPicker(k,field){return `<div class="field"><input type="search" id="pq_${field}" placeholder="🔎 භාණ්ඩය (නම / කේතය)" oninput="prodList('${k}','${field}')" autocomplete="off"></div><div id="pl_${field}"></div>`;}
function prodOk(k,field,p){if(!isW(p))return true;return (k==='bill'&&field==='it')||k==='ret';}
function prodList(k,field){const q=norm($('pq_'+field).value),l=q?P().filter(p=>prodOk(k,field,p)&&(norm(p[1]).includes(q)||(p[2]&&norm(p[2])===q))).slice(0,20):[];$('pl_'+field).innerHTML=l.map(p=>`<button class="pick" onclick="addItem('${k}','${field}','${esc(p[0])}')"><span>${p[2]?`<em>${esc(p[2])}</em> `:''}${isW(p)?'⚖️ ':''}${esc(p[1])}</span><b>${isW(p)?'කිලෝවකට':money(custPrice(cust(D(k).c),p))}</b></button>`).join('');}
/* frequently sold loose / raw goods first (this phone's own history) */
function looseChips(k){if(S.cfg&&S.cfg.wt===0)return '';const w=P().filter(isW).concat((S.newProds||[]).map(n=>newProd(n.id)));if(!w.length)return '';const cnt={};S.sent.forEach(x=>{if(x.rec&&Array.isArray(x.rec.it))x.rec.it.forEach(i=>{cnt[i[0]]=(cnt[i[0]]||0)+1;});});
  const top=w.slice().sort((a,b)=>(cnt[b[0]]||0)-(cnt[a[0]]||0)).slice(0,8);
  return `<details class="loose" open><summary>⚖️ ලිහිල් / අමු බඩු (බරට)</summary><div class="chips">${top.map(p=>`<button onclick="addItem('${k}','it','${esc(p[0])}')">${p[7]==='r'?'🧂':'🌶️'} ${esc(String(p[1]).replace(/\s*\((ලිහිල්|අමු)\)\s*$/,''))}</button>`).join('')}<button class="new" onclick="newLoose('${k}')">＋ අලුත් එකක්</button></div></details>`;}
function newLoose(k){sheet(`<h3>＋ අලුත් ලිහිල් / අමු භාණ්ඩයක්</h3><div class="field"><label>නම</label><input id="nlName" maxlength="60" placeholder="උදා: කරපිංචා කුඩු"></div><div class="seg"><button id="nlL" class="on" onclick="this.classList.add('on');$('nlR').classList.remove('on')">🌶️ ලිහිල් කුඩු</button><button id="nlR" onclick="this.classList.add('on');$('nlL').classList.remove('on')">🧂 අමු ද්‍රව්‍ය</button></div><p class="small muted">බරට විකුණනවා — මිල කිලෝවකට. PC එකේ අනුමත කරද්දී තහවුරු කරනවා.</p><button class="btn primary block" onclick="newLooseAdd('${k}')">＋ බිලට දාන්න</button><button class="btn ghost block" onclick="sheet()">අවලංගු</button>`);setTimeout(()=>$('nlName')&&$('nlName').focus(),60);}
function newLooseAdd(k){const n=$('nlName').value.trim().replace(/\s+/g,' ');if(n.length<2){toast('නම ලියන්න','err');return;}const ex=P().find(p=>isW(p)&&norm(String(p[1]).replace(/\s*\((ලිහිල්|අමු)\)\s*$/,''))===norm(n));if(ex){sheet();addItem(k,'it',ex[0]);return;}
  const kind=$('nlR').classList.contains('on')?'raw':'loose';S.newProds=(S.newProds||[]).filter(x=>norm(x.name)!==norm(n));const id='N'+uid();S.newProds.push({id,name:n,kind});save();sheet();addItem(k,'it',id);}
function addItem(k,field,pid){const d=D(k),p=prod(pid);if(!p)return;const list=d[field];let x=list.find(i=>i[0]===pid);
  if(isW(p)){if(!x){x=[pid,0,0,k==='bill'?loosePrice(d,p):0];list.push(x);}save();render();weightPad(k,field,pid);return;}
  if(!x){x=[pid,0,0,custPrice(cust(d.c),p)];list.push(x);}x[1]+=1;if(field==='it'&&k==='bill')x[2]=freeFor(p,x[1]);save();render();setTimeout(()=>{const el=$('q_'+field+'_'+pid);if(el){el.focus();el.select();}},30);}
function setItem(k,field,pid,i,v){const d=D(k),x=d[field].find(r=>r[0]===pid);if(!x)return;const p=prod(pid);x[i]=i===3?r2(num(v)):(i===1&&isW(p))?kg(Math.max(0,num(v))):Math.max(0,Math.floor(num(v)));if(i===1&&field==='it'&&k==='bill'&&!x.fm)x[2]=freeFor(p,x[1]);if(i===2)x.fm=1;if(i===3)x.pm=1;save();totals(k);if(k==='bill'&&field==='it'&&(i===1||i===3))v460Hint(pid);}
function rmItem(k,field,pid){const d=D(k);d[field]=d[field].filter(r=>r[0]!==pid);save();render();}
function itemRows(k,field,opt){opt=opt||{};const d=D(k);return d[field].map(x=>{const p=prod(x[0])||[x[0],'?'],w=isW(p);return `<div class="irow"><div class="iname">${w?'⚖️ ':''}${esc(p[1])}${p[8]?' <span class="small warn">🆕</span>':''}${opt.price&&!w&&p[3]&&x[3]<custPrice(cust(d.c),p)-0.004?' <span class="bad small">⬇️ සාමාන්‍ය '+money(custPrice(cust(d.c),p))+'</span>':''}</div>${w?`<label>බර<button class="wbtn" id="q_${field}_${esc(x[0])}" onclick="weightPad('${k}','${field}','${esc(x[0])}')">${x[1]>0?wText(x[1]):'⚖️ දාන්න'}</button></label>`:`<label>ගණන<input type="number" inputmode="numeric" min="0" id="q_${field}_${esc(x[0])}" value="${x[1]}" onchange="setItem('${k}','${field}','${esc(x[0])}',1,this.value)"></label>`}${opt.free&&!w?`<label>🎁<input type="number" inputmode="numeric" min="0" value="${x[2]||0}" onchange="setItem('${k}','${field}','${esc(x[0])}',2,this.value)"></label>`:''}${opt.price?`<label>${w?'කිලෝ මිල':'මිල'}<input type="number" inputmode="decimal" min="0" step="0.01" value="${x[3]}" onchange="setItem('${k}','${field}','${esc(x[0])}',3,this.value)"></label>`:''}${opt.price&&w&&x[1]>0?`<span class="small muted">= ${money(x[1]*x[3])}</span>`:''}${opt.kind?`<label>තත්ත්වය<select onchange="D('${k}').${field}.find(r=>r[0]==='${esc(x[0])}')[2]=this.value;save()"><option value="good" ${x[2]!=='damage'?'selected':''}>✅ හොඳයි</option><option value="damage" ${x[2]==='damage'?'selected':''}>⚠️ Damage</option></select></label>`:''}<button class="x" onclick="rmItem('${k}','${field}','${esc(x[0])}')">✕</button></div>`;}).join('')||'<div class="empty small">තවම භාණ්ඩ නැහැ</div>';}
/* ⚖️ big number pad for a weight (g / kg) */
let wp=null;
function weightPad(k,field,pid){const x=D(k)[field].find(r=>r[0]===pid),p=prod(pid);if(!x||!p)return;const u=S.wUnit||'g';wp={k,field,pid,u,s:x[1]>0?(u==='g'?String(Math.round(x[1]*1000)):String(kg(x[1]))):''};wpDraw();}
function wpDraw(){if(!wp)return;const p=prod(wp.pid),v=wpVal();sheet(`<h3>⚖️ ${esc(p[1])}</h3><div class="wpd"><span>${esc(wp.s||'0')}</span> <small>${wp.u==='g'?'g':'kg'}</small></div><div class="small muted" style="text-align:center;min-height:20px">${v>0?'= '+wText(v)+(D(wp.k)[wp.field].find(r=>r[0]===wp.pid)[3]>0&&wp.k==='bill'?' · '+money(v*D(wp.k)[wp.field].find(r=>r[0]===wp.pid)[3]):''):''}</div>
  <div class="seg"><button class="${wp.u==='g'?'on':''}" onclick="wpUnit('g')">ග්‍රෑම් (g)</button><button class="${wp.u==='kg'?'on':''}" onclick="wpUnit('kg')">කිලෝ (kg)</button></div>
  <div class="wpad">${['1','2','3','4','5','6','7','8','9','.','0','⌫'].map(b=>`<button onclick="wpKey('${b}')" ${b==='.'&&wp.u==='g'?'disabled':''}>${b}</button>`).join('')}</div>
  <div class="row2"><button class="btn light" onclick="wp=null;sheet()">අවලංගු</button><button class="btn primary" onclick="wpOk()">✓ හරි</button></div>`);}
function wpVal(){const n=Number(wp.s||0);return kg(wp.u==='g'?n/1000:n);}
function wpKey(b){if(b==='⌫')wp.s=wp.s.slice(0,-1);else if(b==='.'){if(wp.u==='g'||wp.s.includes('.'))return;wp.s=(wp.s||'0')+'.';}else{if(wp.s.replace('.','').length>=7)return;if(wp.s.includes('.')&&wp.s.split('.')[1].length>=3)return;wp.s=(wp.s==='0'?'':wp.s)+b;}wpDraw();}
function wpUnit(u){if(u===wp.u)return;const v=wpVal();wp.u=u;S.wUnit=u;save();wp.s=v>0?(u==='g'?String(Math.round(v*1000)):String(v)):'';wpDraw();}
function wpOk(){const v=wpVal();if(!(v>0)){toast('බර දාන්න','err');return;}if(v>25&&!confirm(`⚖️ ${wText(v)} — ගොඩක් බරයි. හරිද? (ග්‍රෑම් නම් “ග්‍රෑම් (g)” තෝරන්න)`))return;const x=D(wp.k)[wp.field].find(r=>r[0]===wp.pid);if(x)x[1]=v;save();wp=null;sheet();render();}
function rmy(n){return Math.round(((Number(n)||0)+Number.EPSILON)*100)/100;}/* = PC roundMoney */
function billCalc(d){const c=cust(d.c),pct=c?Math.max(0,Math.min(4,num(c[6]))):0;let g=0,base=0;d.it.forEach(x=>{const v=rmy(x[1]*x[3]);g+=v;const p=prod(x[0]);if(!(p&&(p[4]||isW(p))))base+=v;});const disc=rmy(Math.max(0,base)*pct/100);const later=d.later.reduce((s,x)=>s+rmy(x[1]*x[3]),0);const nb=rmy(g-disc),ro=v460Ro(d,nb);return {g:rmy(g),disc,nb,ro,net:rmy(nb-ro),later:rmy(later),pct};}
function totals(k){const el=$('tot_'+k);if(!el)return;const d=D(k);if(k==='bill'){const t=billCalc(d);el.innerHTML=`එකතුව ${money(t.g)}${t.disc?` · Discount ${t.pct}% -${money(t.disc)}`:''} · <strong>බිල ${money(t.net)}</strong>${t.later?`<br>⏳ පස්සේ දෙන බඩු ${money(t.later)}`:''}`;}if(k==='order'){const s=d.it.reduce((a,x)=>a+x[1]*x[3],0);el.innerHTML=`ඇණවුම ${money(s)}`;}}
function bookPicker(d){const bt=books();if(!bt.length)return '';const f=bt.filter(b=>b[3]!=='l'),l=bt.filter(b=>b[3]==='l');const last=d.book&&S.bookLast[d.book],nx=nextNoOf(d.book),typed=Math.floor(num(d.no));

   ${d.book&&bookOf(d.book)&&bookOf(d.book)[3]==='l'?'<div class="small warn">🚚 ලොරි පොතක් — කම්හලේ ලිව්වා (අංක පිළිවෙළ ඒ පොතේමයි; සල්ලි කම්හල් ලාච්චුවට)</div>':''}

function photoField(k){const ph=D(k).pay.ph;return `<div class="field"><label>📷 චෙක් ෆොටෝ (ඕනේ නම්)</label><input type="file" accept="image/*" capture="environment" onchange="takePhoto('${k}',this)">${ph?`<img src="${ph}" style="max-height:90px;border-radius:8px;margin-top:6px"> <button class="btn sm light" onclick="delete D('${k}').pay.ph;save();render()">✕</button>`:''}</div>`;}
function shrinkPhoto(input,done){const f=input.files&&input.files[0];if(!f)return;const img=new Image(),url=URL.createObjectURL(f);img.onload=()=>{const m=640,sc=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);let q=0.6,d=c.toDataURL('image/jpeg',q);while(d.length>90000&&q>0.25){q-=0.1;d=c.toDataURL('image/jpeg',q);}URL.revokeObjectURL(url);done(d);};img.onerror=()=>toast('ෆොටෝ එක කියවන්න බැහැ','err');img.src=url;}
function takePhoto(k,input){shrinkPhoto(input,d=>{D(k).pay.ph=d;save();render();});}

  const used=new Set(d.it.filter(x=>x[1]>0).map(x=>x[0])),np=(S.newProds||[]).filter(n=>used.has(n.id)).map(n=>[n.id,n.name,n.kind]);
  return {d:d.d,book:d.book,no:d.book?Math.floor(num(d.no)):0,c:d.cn==='__walk'?'':d.c,cn:d.cn==='__walk'?'':d.cn,...(d.cn&&d.cn!=='__walk'&&!d.staff?{cr:d.cr||'',cph:d.cph||'',cv:d.cv||''}:{}),...(d.staff?{staff:1}:{}),...(np.length?{np}:{}),it:d.it.filter(x=>x[1]>0).map(x=>[x[0],isW(prod(x[0]))?kg(x[1]):x[1],isW(prod(x[0]))?0:(x[2]||0),x[3]]),later:d.later.filter(x=>x[1]>0).map(x=>[x[0],x[1],x[3]]),prom:d.prom,pay:{m,amt,no:d.pay.no||'',bank:d.pay.bank||'',cd:d.pay.cd||'',...(m==='cheque'&&d.pay.ph?{ph:d.pay.ph}:{})},note:d.note,est:t.net};}

  if(d.book&&!d.editUid&&!d.fixOf){const dup=S.sent.find(x=>x.k==='bill'&&!x.gone&&x.rec.book===d.book&&String(x.rec.no)===String(num(d.no))&&x.d===d.d);if(dup&&!confirm(`⚠️ ${d.d} දින මේ පොතේ #${num(d.no)} දැනටමත් යැව්වා. ආයෙත් යවනවාද?`))return;}

function renderTake(){const d=D('take');$('takeBody').innerHTML=`${dateBanner(d)}<div class="card">${dateField('take')}<div class="field"><label>ගත්ත මුදල (රු.)</label><input type="number" inputmode="decimal" min="0" value="${esc(d.amt)}" onchange="D('take').amt=this.value;save()"></div>
  <div class="field"><label>මොකටද?</label><select onchange="D('take').kind=this.value;save()"><option value="">— තෝරන්න —</option>${Object.entries(TK).map(([k,v])=>`<option value="${k}" ${d.kind===k?'selected':''}>${v}</option>`).join('')}</select></div>
  <div class="field"><label>කවුද ගත්තේ / කාටද</label><input value="${esc(d.staff)}" onchange="D('take').staff=this.value;save()"></div><div class="field"><label>හේතුව</label><input maxlength="200" value="${esc(d.note)}" onchange="D('take').note=this.value;save()"></div></div>
  <button class="btn primary block big" onclick="sendTake()">📤 PC එකට යවන්න</button>`;}
async function sendTake(){const d=D('take'),amt=r2(num(d.amt));if(!(amt>0)){toast('මුදල දාන්න','err');return;}if(!d.kind){toast('මොකටද කියලා තෝරන්න','err');return;}
  if(await send('take',{d:d.d,amt,kind:d.kind,who:d.staff.trim(),reason:d.note},`💸 ${TK[d.kind]} ${money(amt)}`)){newDraft('take');toast('✅ යැව්වා');go('home');}}
/* ---------- orders ---------- */
function renderOrder(){const d=D('order');$('orderBody').innerHTML=`${dateBanner(d)}<div class="card">${dateField('order')}</div>${custPicker('order',false)}
  <div class="card"><h3>📋 ඇණවුම් බඩු</h3>${itemPicker('order','it')}${itemRows('order','it',{price:1})}<div class="totbox" id="tot_order"></div>
  <div class="field"><label>දෙන්න පොරොන්දු වුණ දිනය</label><input type="date" value="${esc(d.prom)}" onchange="D('order').prom=this.value;save()"></div></div>
  <div class="card"><h3>💵 කලින් ගෙව්වා (advance)</h3><div class="field"><input type="number" inputmode="decimal" min="0" placeholder="0 = බඩු ලැබුණාම" value="${esc(d.adv)}" onchange="D('order').adv=this.value;save()"></div></div>
  <button class="btn primary block big" onclick="sendOrder()">📤 PC එකට යවන්න</button>`;totals('order');}
async function sendOrder(){const d=D('order'),c=cust(d.c);if(!c){toast('කඩය තෝරන්න','err');return;}const it=d.it.filter(x=>x[1]>0);if(!it.length){toast('බඩු දාන්න','err');return;}
  if(await send('order',{d:d.d,c:c[0],it:it.map(x=>[x[0],x[1],x[3]]),prom:d.prom,adv:r2(num(d.adv))},`📋 ${c[1]} ඇණවුම`)){rememberCust(c[0]);newDraft('order');toast('✅ යැව්වා');go('home');}}
function renderOrders(){const o=(S.cfg.o||[]),sent=new Set(S.sent.filter(x=>x.k==='odel').map(x=>x.rec.o+'|'+x.rec.at.slice(0,10)));
  $('ordersBody').innerHTML=o.length?o.map(x=>{const late=x[4]&&x[4]<today();return `<div class="card ${late?'late':''}"><div class="row"><div class="grow"><strong>${esc(x[2])}</strong><div class="small muted">${esc(x[6]||'')} · ගත්තේ ${esc(x[7]||'')}${x[4]?' · පොරොන්දුව '+esc(x[4]):''}${late?' <span class="bad">⏰ පරක්කුයි</span>':''}${x[5]>0?' · advance '+money(x[5]):''}</div></div></div>
   ${x[3].map(i=>`<div class="irow"><div class="iname">${esc(i[1])} <span class="muted small">(${i[2]}ක්)</span></div><label>දුන්නේ<input type="number" inputmode="numeric" min="0" max="${i[2]}" value="${i[2]}" id="od_${esc(x[0])}_${esc(i[0])}"></label></div>`).join('')}
   <button class="btn primary block" onclick="sendDeliver('${esc(x[0])}')">✓ දුන්නා — PC එකට යවන්න</button></div>`;}).join(''):'<div class="card empty">දෙන්න තියෙන ඇණවුම් නැහැ ✅</div>';}
async function sendDeliver(id){const x=(S.cfg.o||[]).find(o=>o[0]===id);if(!x)return;const it=x[3].map(i=>[i[0],Math.max(0,Math.min(i[2],Math.floor(num(($('od_'+id+'_'+i[0])||{}).value))))]).filter(i=>i[1]>0);if(!it.length){toast('ගණන් දාන්න','err');return;}
  if(S.sent.some(s=>s.k==='odel'&&s.rec.o===id&&!okSet().has(s.uid))&&!confirm('මේ ඇණවුම දුන්නා කියලා දැනටමත් යැව්වා (PC එක තවම අනුමත කළේ නැහැ). ආයෙත් යවනවාද?'))return;
  if(await send('odel',{d:today(),o:id,c:x[1],it},`🚚 ${x[2]} ඇණවුම දුන්නා`)){toast('✅ යැව්වා');go('home');}}
/* ---------- ✏️ / ❌ after sending ---------- */
function canFix(x){const ok=okSet(),rj=rjMap();return x.k==='bill'&&!x.gone&&!x.fix&&!rj.has(x.uid)&&Date.now()-new Date(x.at)<14*864e5&&(ok.has(x.uid)||true);}
function inOutbox(uid){return S.outbox.some(o=>o.uid===uid);}
function fixEdit(uid){const x=S.sent.find(s=>s.uid===uid);if(!x||!x.rec)return;const r=x.rec,local=inOutbox(uid);
  if(r.pay&&r.pay.ph===1){toast('චෙක් ෆොටෝ එක phone එකේ නැහැ — ෆොටෝ එක ආයෙත් ගන්න','warn');}
  const d={d:r.d,c:r.c||'',cn:r.cn||(!r.c&&!r.cn?'__walk':''),staff:r.staff?1:0,cr:r.cr||'',cph:r.cph||'',cv:r.cv||'',it:r.it.map(i=>[i[0],i[1],i[2]||0,i[3]]),later:(r.later||[]).map(i=>[i[0],i[1],0,i[2]]),pay:{m:r.pay.m,amt:r.pay.m==='part'||r.pay.m==='cheque'?String(r.pay.amt):'',no:r.pay.no||'',bank:r.pay.bank||'',cd:r.pay.cd||'',...(r.pay.ph&&r.pay.ph!==1?{ph:r.pay.ph}:{})},book:r.book||'',no:r.no?String(r.no):'',noAuto:0,note:r.note||'',prom:r.prom||'',chain:0,...(local?{editUid:uid}:{fixOf:uid,why:''})};
  S.drafts.bill=d;save();go('bill');}
async function fixVoid(uid){const x=S.sent.find(s=>s.uid===uid);if(!x)return;
  if(inOutbox(uid)){if(!confirm(`“${x.label}” — තවම PC එකට ගිහින් නැහැ. මේක මකන්නද? (PC එකට යන්නේ නැහැ)`))return;S.outbox=S.outbox.filter(o=>o.uid!==uid);x.gone=1;x.label='❌ '+x.label+' (phone එකේදී අවලංගු කළා)';save();render();toast('❌ අයින් කළා');return;}
  const why=(prompt('❌ අවලංගු කරන්න — හේතුව (අනිවාර්යයි):','')||'').trim();if(why.length<3){toast('හේතුව ලියන්න','err');return;}
  if(await send('fix',{d:x.d,ref:uid,act:'void',why},`❌ අවලංගු ඉල්ලීම — ${x.label.slice(2)}`)){x.fix='void';save();toast('✅ ඉල්ලීම යැව්වා — PC එකේ අනුමත කරනවා');render();}}
/* change a message that is still on this phone (not sent yet): same uid, new code */
async function resend(uid,body,label){const o=S.outbox.find(x=>x.uid===uid),h=S.sent.find(x=>x.uid===uid);if(!o||!h){toast('මේක දැනටමත් PC එකට ගියා — “✏️” ආයෙත් ඔබන්න (ඉල්ලීමක් විදිහට යනවා)','warn');return false;}
  const rec={...h.rec,...body,uid,rev:(h.rec.rev||1)+1,at:new Date().toISOString(),pv:S.cfg.pv||''};let code;try{code=await seal('fx',rec);}catch(e){toast('Encrypt කරන්න බැරි වුණා','err');return false;}
  if(!S.outbox.some(x=>x.uid===uid)){toast('මේ අතරේ PC එකට ගියා — ඉල්ලීමක් විදිහට යවන්න','warn');return false;}
  o.code=code;o.at=rec.at;const keep=JSON.parse(JSON.stringify(rec));if(keep.pay&&keep.pay.ph)keep.pay.ph=1;h.rec=keep;h.label=label+' ✏️';h.at=rec.at;h.d=rec.d;save();flush().then(()=>{if(['home','history'].includes(screen))render();});return true;}
/* ---------- history / setup ---------- */
function renderHistory(){const ok=okSet(),rj=rjMap(),out=new Set(S.outbox.map(x=>x.uid));
  $('historyBody').innerHTML=cloudLine()+(S.sent.length?S.sent.slice(0,120).map(x=>{const st=x.gone?'<span class="muted">—</span>':rj.has(x.uid)&&/^phone එකෙන්/.test(rj.get(x.uid))?'<span class="muted">🔁 වෙනස් කළා</span>':rj.has(x.uid)?`<span class="bad">❌ ප්‍රතික්ෂේප</span>`:ok.has(x.uid)?'<span class="ok">✅ PC එකේ</span>':out.has(x.uid)?'<span class="bad">📱 phone එකේ</span>':'<span class="wait">☁️ ගියා</span>';
    return `<div class="hist"><div class="grow"><strong>${esc(x.label)}</strong><div class="small muted">${esc(x.d)} · ${esc(fmtAt(x.at))}${x.up?' · ☁️ '+esc(fmtAt(x.up)):''}${x.fix?` · ${x.fix==='void'?'❌ අවලංගු ඉල්ලුවා':'✏️ නිවැරදි කිරීම යැව්වා'}`:''}${rj.has(x.uid)?' · '+esc(rj.get(x.uid)):''}</div>${canFix(x)?`<div class="hbtns"><button class="btn sm light" onclick="fixEdit('${esc(x.uid)}')">✏️ නිවැරදි කරන්න</button><button class="btn sm light" onclick="fixVoid('${esc(x.uid)}')">❌ අවලංගු කරන්න</button></div>`:(!x.gone&&out.has(x.uid)&&x.k!=='bill'?`<div class="hbtns"><button class="btn sm light" onclick="fixVoid('${esc(x.uid)}')">❌ මකන්න (තවම නොගිය)</button></div>`:'')}</div>${st}</div>`;}).join(''):'<div class="card empty">තවම නැහැ</div>');}
function renderSetup(){$('setupBody').innerHTML=`<div class="card"><div class="field"><label>ඔයාගේ නම</label><input id="meName" maxlength="40" value="${esc(S.me)}"></div><button class="btn primary block" onclick="const n=$('meName').value.trim();if(n.length<2){toast('නම දාන්න','err');return;}S.me=n;save();toast('✅ සුරැකුවා');go('home')">💾 සුරකින්න</button></div>
  <div class="card">${cloudLine()}<div class="small muted">${S.cloud?'Project: '+esc(S.cloud.p):'සකසලා නැහැ'} · Phone ID: ${esc(ensureDev())}</div><button class="btn light block" onclick="askPersist()">🔒 Phone එකේ ස්ථිරව තියාගන්න ඉල්ලන්න</button>${bOn()?`<button class="btn light block" onclick="send('bfull',{},'',true).then(ok=>{if(ok)toast('🔄 ඉල්ලුවා — PC එක on වුණාම ඔක්කොම එනවා (විනාඩි කීපයක්)');})">🔄 Batch විස්තර ඔක්කොම ආයෙත් ගන්න</button><div class="small muted">Phone එකේ batch ${BT.size} · අන්තිම sync ${esc(fmtAt(S.bsync,true)||'—')}</div>`:''}<p class="small muted">⚠️ Chrome → “Clear data” / app එක (Home screen icon එක) මකන්න එපා — PC එකට නොගිය බිල් නැති වෙනවා. Phone එක මාරු කරනවා නම් PC එකෙන් අලුත් link එකක් ගන්න (පරණ එක ඉබේම නවතිනවා).</p></div>`+linkBox(S.cloud?'Phone එක මාරු කළොත් / අලුත් link එකක් ආවොත්:':'');}
async function askPersist(){try{const ok=navigator.storage&&navigator.storage.persist?await navigator.storage.persist():false;toast(ok?'✅ ස්ථිර ගබඩාව ලැබුණා':'Phone එක ඉඩ දුන්නේ නැහැ — app එක Home screen එකට දාලා පාවිච්චි කරන්න',ok?'ok':'warn');}catch(e){toast('බැහැ','warn');}}
/* ---------- 📝 reminder notes (→ a red bar on the PC; 📲 an alarm on this phone) ---------- */
function notesOn(){return !(S.cfg&&S.cfg.nt===0);}
function pcNotes(){const ack=new Set(S.nack||[]);return ((S.cfg&&S.cfg.n)||[]).filter(n=>!ack.has(n[0]));}
function myNotesOpen(){const nd=new Set((S.cfg&&S.cfg.nd)||[]);return (S.notes||[]).filter(n=>!n.done&&!nd.has(n.id));}
function notesOpenCount(){return myNotesOpen().length+pcNotes().length;}
function dueOf(w,dt,tm){const t=today();if(w==='night')return t+'T20:00';if(w==='tom')return addDays(t,1)+'T07:30';if(w==='date'&&dt)return dt+'T'+(tm||'08:00');return '';}
function dueText(d){if(!d)return '';const t=today(),day=d.slice(0,10),tm=d.slice(11,16);return (day===t?'අද':day===addDays(t,1)?'හෙට':day)+(tm?' '+tm:'');}
let noteDraft={text:'',w:'',dt:'',tm:'08:00',urgent:0,ph:''};
function renderNotes(){const mine=myNotesOpen(),pcn=pcNotes(),nd=new Set((S.cfg&&S.cfg.nd)||[]),done=(S.notes||[]).filter(n=>n.done||nd.has(n.id)).slice(-8).reverse();
  $('notesBody').innerHTML=`<div class="card"><h3>📝 අලුත් මතක් කිරීමක්</h3><div class="field"><textarea id="ntText" class="ntext" maxlength="500" placeholder="උදා: මිරිස් label ඉවරයි — ඇණවුම් කරන්න" oninput="noteDraft.text=this.value">${esc(noteDraft.text)}</textarea></div>
   <div class="field"><label>කවදාට? (ඕනේ නම්)</label><div class="seg">${[['','— නැහැ —'],['night','🌙 අද රෑ'],['tom','🌅 හෙට උදේ'],['date','📅 දිනයක්']].map(([v,l])=>`<button class="${noteDraft.w===v?'on':''}" onclick="noteDraft.w='${v}';render()">${l}</button>`).join('')}</div>${noteDraft.w==='date'?`<div class="row2"><input type="date" min="${today()}" value="${esc(noteDraft.dt)}" onchange="noteDraft.dt=this.value"><input type="time" value="${esc(noteDraft.tm)}" onchange="noteDraft.tm=this.value"></div>`:''}</div>
   <label class="check"><input type="checkbox" ${noteDraft.urgent?'checked':''} onchange="noteDraft.urgent=this.checked?1:0"> 🔴 හදිසි</label>

async function bStatus(no,st){const why=(prompt(st==='hold'?`🔴 ${no} නවත්වන්නේ ඇයි?`:`🟢 ${no} ආයෙත් හරි — හේතුව:`,'')||'').trim();if(why.length<2){toast('හේතුව ලියන්න','err');return;}

async function ldPush(){const url=ldDoc();if(!url)return;const m=ldMine();const body=JSON.stringify({by:S.me,at:new Date().toISOString(),sc:m.sc});if(m.sent===body)return;const f='s_'+ensureDev().replace(/[^A-Za-z0-9_]/g,'_');

function ldScan(t){const p=QS.parse(t);if(!p||p.k!=='bundle'){toast(p&&p.k==='batch'?'මේක පොතේ sticker එක — බණ්ඩලයේ sticker එක scan කරන්න':'බණ්ඩල sticker එකක් නෙවෙයි','warn');return;}

function oldestOther(pid,no){const f=S.stk&&S.stk.f?S.stk.f.find(x=>x[0]===pid):null;if(!f)return '';const used=new Set(ldAll().filter(x=>x.pid===pid).map(x=>x.no));const older=f[1].find(([b,q])=>b&&b!==no&&q>0&&!used.has(b)&&String(b.split('-')[1]||'').slice(4)+String(b.split('-')[1]||'').slice(2,4)+String(b.split('-')[1]||'').slice(0,2)<String(no.split('-')[1]||'').slice(4)+String(no.split('-')[1]||'').slice(2,4)+String(no.split('-')[1]||'').slice(0,2));return older?older[0]:'';}

const buySend=v47Busy(async function(){const d=BD(),sp=((S.cfg&&S.cfg.sp)||[]).find(s=>s[0]===d.sup);if(!sp&&!String(d.sn||'').trim()){toast('සැපයුම්කරු තෝරන්න','err');return;}
  const L=d.it.filter(i=>String(i.n||'').trim());if(!L.length){toast('ද්‍රව්‍යයක් දාන්න','err');return;}if(L.some(i=>!(num(i.q)>0))){toast('හැම ද්‍රව්‍යයකටම ප්‍රමාණය දාන්න','err');return;}
  const tot=buyTot(),pm=tot>0?d.pm:'credit',pa=pm==='credit'?0:r2(d.pa===''?tot:num(d.pa));if(pm==='cheque'&&(!String(d.cq).trim()||!d.cd)){toast('චෙක් අංකය සහ දිනය දාන්න','err');return;}if(pm!=='credit'&&!(pa>0)){toast('ගෙවපු මුදල දාන්න','err');return;}
  /* a lot number for every raw material (written on the sack; the sticker comes from the PC) */
  const lots=[],it=L.map(i=>{const m=mtByName(i.n),kd=m?(m[2]==='p'?'p':'r'):(i.kd==='p'?'p':'r'),q=num(i.q),t=r2(num(i.t));let lot='';
    if(kd==='r'){lot=nextLotNo(d.d);const l={lid:'FL'+ensureDev()+'-'+(++S.seq),no:lot,sup:sp?sp[0]:'',sn:sp?sp[1]:d.sn,mat:m?m[1]:i.n,q,u:i.u||'kg',d:d.d,inv:d.inv||'',nt:d.note||''};myL().unshift(l);lots.push(l);}
    return [m?m[1]:i.n,q,i.u||'kg',q>0&&t>0?Math.round(t/q*10000)/10000:0,t,lot,kd];});
  const ok=await send('buy',{d:d.d,sup:sp?sp[0]:'',sn:sp?sp[1]:String(d.sn).trim(),it,tot,inv:String(d.inv||'').trim(),nt:d.note||'',pay:{m:pm,amt:pa,no:String(d.cq||'').trim(),d:d.cd||''}},`🛒 ${sp?sp[1]:d.sn} ${tot?money(tot):''} · ${it.map(x=>x[0]).join(', ').slice(0,40)}`);

  S.myL=myL().slice(0,200);buyNew();save();

const mcSend=v47Busy(async function(){const d=S.drafts.mcnt||{c:{}},ids=new Set(MT().map(m=>m[0])),it=Object.entries(d.c||{}).filter(([id,v])=>ids.has(id)&&v!==''&&num(v)>=0).map(([id,v])=>[id,Math.round(num(v)*1000)/1000]);if(!it.length){toast('ගණනක් දාලා නැහැ','err');return;}

/* ---------- 📖 recipe amounts for a batch size ---------- */
let rcSel='',rcKg='';
function rcFor(fam){return RC().filter(r=>r.f===fam);}
/* [{n, g, fam}] for a recipe at kg / packets */
function rcLines(r,kg,pk){const out=[];if(r.m!=='p'&&num(kg)>0&&r.b>0){const f=num(kg)*1000/r.b;(r.l||[]).forEach(([n,g,fam])=>out.push({n,g:g*f,fam}));}
  (r.p||[]).forEach(([n,g,fam])=>{if(!(num(pk)>0))return;const x=out.find(o=>norm(o.n)===norm(n));if(x)x.g+=g*num(pk);else out.push({n,g:g*num(pk),fam});});return out;}
function rcTable(r,kg,pk){const L=rcLines(r,kg,pk),inG=L.reduce((s,l)=>s+l.g,0);if(!L.length)return `<div class="small muted">${r.m==='p'?'පැකට් ගණන දාන්න.':'kg ගණන දාන්න (kg = '+esc(r.bt)+').'}</div>`;

function v463Ob(cid){const o=S.cfg&&S.cfg.ob;return o&&Array.isArray(o[cid])?o[cid]:[];}

   ${!ob.length&&c[3]>0?'<div class="small muted">බිල් අනුව ලැයිස්තුව PC එකෙන් තවම ආවේ නැහැ (🔄)</div>':''}</div>`;}
function v463Bills(d,c){const amt=r2(num(d.amt)),rows=v463Alloc(d,c,amt),ob=v463Ob(c[0]);if(!ob.length)return '';
